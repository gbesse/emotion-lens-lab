[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-lens-lab"
version = "0.1.0a1"
description = "Perspectives émotionnelles · Emotion perspectives · Perspectivas emocionales"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["certifi==2026.10.18"]

[project.scripts]
emotion-lens = "emotion_lens.__main__:main"

[tool.setuptools.packages.find]
include = ["emotion_lens*"]

[tool.setuptools.package-data]
emotion_lens = ["web/*", "examples/*"]
